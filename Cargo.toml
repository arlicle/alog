[package]
name = "alog"
version = "0.1.0"
edition = "2021"
description = "A blazing fast blog generator"
license = "MIT OR Apache-2.0"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Web server
axum = "0.8"
tower-http = { version = "0.5", features = ["fs", "trace"] }

# Markdown parsing
pulldown-cmark = "0.13"

# File watching
notify = "7.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Template engine
askama = "0.12"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# YAML parsing
serde_yaml = "0.9"

# RSS feed generation
rss = "2.0"
