<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/js/prism.css">
    <link rel="stylesheet" href="/css/app.css">
    <title>{% block page_title %}{{ site_title }}{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
  </head>
  <body>
    {% block content %}{% endblock %}

    <button class="btn btn-link m-menu-toggle d-md-none fixed-top collapsed" type="button" data-toggle="collapse" data-target="#m-menu" aria-controls="m-menu" aria-expanded="false" aria-label="Toggle docs navigation">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="30" height="30" focusable="false"><title>Menu</title><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-miterlimit="10" d="M4 7h22M4 15h22M4 23h22"></path></svg>
    </button>

    <ul class="nav flex-column collapse fixed-top site-menu d-md-block" id="m-menu">
      <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
      <li class="nav-item"><a class="nav-link" href="/p/list/">所有文章</a></li>
      {% for page in pages %}
      <li class="nav-item"><a class="nav-link" href="{{ page.url }}">{{ page.label }}</a></li>
      {% endfor %}
      <li class="nav-item"><a class="nav-link" href="https://github.com/arlicle">Github</a></li>
    </ul>

    {% block extra_footer %}{% endblock %}

    <footer class="footer mt-5 pb-2">
      <div class="container text-center">
        <p><span class="text-black-50">Powered by <a href="https://github.com/arlicle/ablog">ablog</a> © 2019 叫兽</span></p>
      </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
    <script src="/js/prism.js"></script>
    <script>
      $(function () { $('[data-toggle="tooltip"]').tooltip(); });
    </script>
    <script type="text/x-mathjax-config">
      MathJax.Hub.Config({tex2jax: {inlineMath: [['$','$'], ['\\(','\\)']]}, displayAlign: "left", scale: 180});
    </script>
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-MML-AM_SVG"></script>
  </body>
</html>
