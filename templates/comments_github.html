<!-- GitHub Comments System -->
<div class="comments-section" id="comments">
    <h3>Comments</h3>
    <div id="github-comments"></div>
</div>

<script src="https://utteranc.es/client.js"
        repo="{{ repo }}"
        issue-term="{{ issue_term }}"
        theme="{{ theme }}"
        {% if let Some(label) = label %}
        label="{{ label }}"
        {% endif %}
        crossorigin="anonymous"
        async>
</script>

<style>
.comments-section {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid #e0e0e0;
}

.comments-section h3 {
    margin-bottom: 1.5rem;
    font-size: 1.5rem;
    color: #333;
}

#github-comments {
    margin-top: 1rem;
}

/* 响应式调整 */
@media (max-width: 768px) {
    .comments-section {
        margin-top: 2rem;
        padding-top: 1.5rem;
    }

    .comments-section h3 {
        font-size: 1.25rem;
    }
}
</style>
